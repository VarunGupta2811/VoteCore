<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Online Voting System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Online Voting System</h1>
        
        <div class="card" id="registerCard">
            <h2>Create an Account</h2>
            
            <input type="text" id="regFirstName" placeholder="First Name">
            <input type="text" id="regLastName" placeholder="Last Name">
            <input type="email" id="regEmail" placeholder="Email Address">
            <input type="password" id="regPassword" placeholder="Password">
            <input type="password" id="regConfirmPassword" placeholder="Confirm Password">
            
            <button onclick="registerUser()">Register</button>
            
            <p id="regMessage" style="padding: 10px; border-radius: 5px; display: none;"></p>
            
            <br>
            <p><a href="index.html">Already have an account? Login here</a></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
