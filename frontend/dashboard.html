<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — VoteCore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="app-page" onload="loadDashboard()">
<main class="container app-shell">
    <header class="app-header">
        <a class="wordmark" href="dashboard.html"><span>VOTE</span>CORE</a>
        <div class="header-actions" style="display: flex; gap: 10px;">
            <button class="btn btn-neutral" onclick="window.location.href='profile.html'">My Profile</button>
            <button class="btn btn-danger" onclick="logout()">Log Out</button>
        </div>
    </header>

    <section class="page-hero">
        <div>
            <p class="eyebrow">Your Workspace</p>
            <h1 id="welcome">Welcome!</h1>
        </div>
        <div class="hero-status">Ready to vote</div>
    </section>

    <!-- Admin & Organizer Jump Links (Hidden for normal voters) -->
    <div id="superAdminBtnContainer" style="display: none; margin-bottom: 20px;">
        <button class="btn btn-primary btn-full" style="padding: 15px; font-size: 16px;" onclick="window.location.href='admin.html'">👑 Global Super Admin Panel →</button>
    </div>
    <div id="organizerBtnContainer" style="display: none; margin-bottom: 20px;">
        <button class="btn btn-gold btn-full" style="padding: 15px; font-size: 16px;" onclick="window.location.href='admin.html'">⚙️ Organizer Management Panel →</button>
    </div>

    <!-- Request PaaS Hosting Action -->
    <div id="requestHostBtnContainer" style="margin-bottom: 25px;">
        <button class="btn btn-gold btn-full" style="padding: 14px; font-size: 15px; font-weight: bold;" onclick="openHostModal()">🏛️ Request to Host an Election for Your Institution →</button>
    </div>

    <section class="card">
        <p class="card-kicker">Open Ballots</p>
        <h2>Available elections</h2>
        <div id="elections" class="data-panel"><p>Loading...</p></div>
    </section>

    <!-- PaaS Hosting Modal Form -->
    <div id="hostModalBackdrop" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(11,27,51,0.7); z-index:999;" onclick="closeHostModal()"></div>
    <div id="hostRequestModal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#FFFFFF; padding:30px; border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,0.3); z-index:1000; width:450px; max-width:90%;">
        <h2 style="color:#0B1B33; margin-top:0; margin-bottom:5px;">Host an Election</h2>
        <p style="color:#5B6478; font-size:14px; margin-bottom:20px;">Apply to provision a managed, isolated election environment for your institution.</p>
        
        <label for="hostOrgName" style="display:block; font-size:13px; font-weight:bold; color:#0B1B33; margin-bottom:4px;">Organization / Institution Name *</label>
        <input type="text" id="hostOrgName" placeholder="e.g. NIT Warangal or EC Council" style="width:100%; padding:10px; border:1px solid #D7DDE8; border-radius:4px; margin-bottom:15px; box-sizing:border-box;">
        
        <label for="hostTitle" style="display:block; font-size:13px; font-weight:bold; color:#0B1B33; margin-bottom:4px;">Election Title *</label>
        <input type="text" id="hostTitle" placeholder="e.g. 2026 Student Council Election" style="width:100%; padding:10px; border:1px solid #D7DDE8; border-radius:4px; margin-bottom:15px; box-sizing:border-box;">
        
        <label for="hostDesc" style="display:block; font-size:13px; font-weight:bold; color:#0B1B33; margin-bottom:4px;">Description / Purpose</label>
        <textarea id="hostDesc" rows="3" placeholder="Explain what this election is for..." style="width:100%; padding:10px; border:1px solid #D7DDE8; border-radius:4px; margin-bottom:20px; box-sizing:border-box;"></textarea>
        
        <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button class="btn btn-secondary" onclick="closeHostModal()">Cancel</button>
            <button class="btn btn-primary" onclick="submitHostRequest()">Submit Application</button>
        </div>
    </div>

</main>
<script src="script.js"></script>
</body>
</html>
