<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Election Dashboard — VoteCore</title>
    <link rel="stylesheet" href="style.css?v=20260911e">
</head>
<body class="app-page election-page" onload="loadElection()">

    <!-- Navigation Bar -->
    <header class="top-nav">
        <a class="wordmark" href="dashboard.html"><span>VOTE</span>CORE</a>
        <div id="welcome" style="font-size: 0.9rem; color: #94a3b8; font-family: monospace;">Loading Profile...</div>
    </header>

    <main class="main-container">
        
        <!-- Dynamic Election Header injected by JS -->
        <section class="election-hero">
            <p class="eyebrow">Official ballot</p>
            <h1 id="electionTitle">Loading Election...</h1>
            <p id="electionDescription"></p>
            <div id="electionStatus">
                Phase: Decrypting
            </div>
        </section>

        <!-- The Main Dashboard UI -->
        <section class="content-card election-content-card">
            
            <!-- 
              NOTE: The static "Meet the candidates" header has been completely removed.
              The empty div below acts as a blank canvas. Our JavaScript will dynamically 
              stack the Voter Banner, the Party Panel, and the Ballot inside it in the perfect order.
            -->
            <div id="candidates"></div>

        </section>
        
        <a href="dashboard.html" class="btn-back">← Back to dashboard</a>

    </main>

    <script src="script.js?v=FINAL_ELECTION_UI"></script>
</body>
</html>
